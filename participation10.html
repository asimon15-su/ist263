<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <title>Title</title>
        <style>
            @media only screen and (min-width: 801px) {
                .small {display: none; }
            }
            @media only screen and (max-width: 800px) {
                .large {display: none; }
                .small {display: block; }
            }
        </style>
    </head>

    <body>
        <p class="large">I'm Large</p>
        <p class="small">I'm Small</p>

    </body>

</html>
