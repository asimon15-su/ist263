<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Title</title>
        <style>
            #first {color: #ff0000; }
        </style>
        <script>
            function wrongAnswer () {
                document.getElementById("wrong").innerHTML = "<span style='color: red;'> True is the wrong answer! </span>" }
            function rightAnswer () {
                document.getElementById("correct").innerHTML = "<span style='color: green;'> False is the correct answer! </span> " }
            function change () {
                document.getElementById("arrow").setAttribute("src", "https://peopel-su.github.io/ist263/images/arrow_over.png") }
            function changeBack () {
                document.getElementById("arrow").setAttribute("src", "https://peopel-su.github.io/ist263/images/arrow.png") }
            function colorChange () {
                document.getElementById("first").style.color = "#000000"}
            
        </script>
    </head>

    <body>
        <h1 onclick="colorChange ();" id="first">Header</h1>
        <h1> My JavaScript Quiz </h1>
        <p>Java and JavaScript are the same thing.</p>
        <p onclick="wrongAnswer ();" id="wrong">True</p>
        <p onclick="rightAnswer ();" id="correct">False</p>
        <img onmouseover="change (); " onmouseout="changeBack (); " id="arrow" src="https://peopel-su.github.io/ist263/images/arrow.png" onclick="colorChange (); " alt="arrow icon">
    </body>

</html>
